name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    name: runtime (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # debugpy powers the DAP integration tests, which drive a real debug
      # session rather than mocking one.
      - run: pip install pytest numpy pandas debugpy
      - run: python -m pytest packages/runtime/tests -q

  runtime-bare:
    # The runtime claims to work in a debuggee with nothing installed. That
    # claim is only worth anything if it is tested without numpy present.
    name: runtime (no third-party packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest packages/runtime/tests -q

  runtime-tensors:
    # Torch is a large download, so it runs once on one version rather than
    # across the matrix. The tensor tests cover conversion decisions -- autograd
    # detachment, device transfer, bfloat16 widening -- that only real torch can
    # exercise.
    name: runtime (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pytest packages/runtime/tests/test_capture_tensors.py -q

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          # The extension's envelope tests round-trip through the real Python
          # runtime rather than through a fixture, so Python is needed here too.
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  package:
    name: package vsix
    runs-on: ubuntu-latest
    needs: [extension]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter python-debug-visualizer run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/extension/*.vsix
